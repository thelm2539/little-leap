# .github/workflows/export-manifest.yml
#
# Regenerates app-export/activity-manifest.json on every push to main
# and commits it back to the repo so the research agent always reads
# a fresh snapshot of live activity content.
#
# The research agent reads:  app-export/activity-manifest.json
# The app writes:            src/lib/littleleaps/data.ts  (via human review only)
# Direction:                 one-way — app → manifest — agent (agent never writes back)

name: Export Activity Manifest

on:
  push:
    branches: [main]
    paths:
      # Only re-run when the source data actually changes
      - "src/lib/littleleaps/data.ts"
      - "scripts/export-activity-manifest.ts"

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need write access to push the manifest back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run export script
        run: bun run scripts/export-activity-manifest.ts

      - name: Commit manifest if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-export/activity-manifest.json
          # Only commit if something actually changed
          git diff --staged --quiet || git commit -m "chore: refresh activity manifest [skip ci]"
          git push
